<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mosu! Preview Settings</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: rgb(24, 23, 28);
      color: rgb(255, 255, 255);
      font-family: sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .settings-page {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 16px;
    }
  </style>
  <link rel="stylesheet" href="options.css" />
</head>

<body>
  <main class="settings-page">
    <section class="settings-card">
      <p id="saveStatus" class="settings-status" aria-live="polite"></p>
      <div class="settings-header">
        <p class="settings-eyebrow">Settings</p>
        <h1>mosu! Preview</h1>
      </div>

      <div class="settings-group">
        <h2 class="settings-section-title">popup</h2>
        <label for="popupSize" class="settings-label">Popup size</label>
        <div class="settings-select-wrap">
          <select id="popupSize" class="settings-select">
            <option value="compact">Compact</option>
            <option value="default">Default (recommended)</option>
            <option value="large">Large</option>
          </select>
        </div>
        <p class="settings-help">
          Changes the popup width.
        </p>
      </div>

      <div class="settings-group">
        <h2 class="settings-section-title">hitsounds <span class="settings-experimental-tag">experimental</span></h2>
        <label for="hitsounds" class="settings-toggle-card">
          <input id="hitsounds" type="checkbox" />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Play hitsounds</span>
            <span class="settings-toggle-description">Synthesised claps, whistles and finishes.</span>
          </span>
        </label>
        <div class="settings-slider-card settings-slider-card--single">
          <label for="hitsoundVolume" class="settings-slider-copy">
            <span class="settings-slider-title">Hitsound volume</span>
            <span class="settings-slider-value"><span id="hitsoundVolumeValue">50%</span></span>
          </label>
          <div class="settings-slider-controls">
            <input id="hitsoundVolume" class="settings-range" type="range" min="0" max="100" step="5" value="50" />
          </div>
        </div>
        <p class="settings-help">
          Hitsounds are generated in browser so custom hitsounds are not supported right now.
        </p>
      </div>

      <div class="settings-group">
        <h2 class="settings-section-title">standard preview</h2>
        <label for="standardSnakingSliders" class="settings-toggle-card">
          <input id="standardSnakingSliders" type="checkbox" />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Snake sliders in</span>
            <span class="settings-toggle-description">Animate slider bodies in.</span>
          </span>
        </label>
        <label for="standardSliderSnakeOut" class="settings-toggle-card">
          <input id="standardSliderSnakeOut" type="checkbox" />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Snake sliders out</span>
            <span class="settings-toggle-description">Trim slider bodies out.</span>
          </span>
        </label>
        <label for="standardSliderEndCircles" class="settings-toggle-card">
          <input id="standardSliderEndCircles" type="checkbox" checked />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Show slider end circles</span>
            <span class="settings-toggle-description">Keep a circle at the end of sliders.</span>
          </span>
        </label>
      </div>

      <div class="settings-group">
        <h2 class="settings-section-title">mania preview</h2>
        <div class="settings-slider-card">
          <label for="maniaScrollSpeedRange" class="settings-slider-copy">
            <span class="settings-slider-title">Scroll speed</span>
            <span class="settings-slider-value">
              <span id="maniaScrollTimeValue">1429 ms</span>
              <span>(speed <span id="maniaScrollSpeedValue">28.0</span>)</span>
            </span>
          </label>
          <div class="settings-slider-controls">
            <input id="maniaScrollSpeedRange" class="settings-range" type="range" min="1" max="40" step="1" value="28" />
            <input id="maniaScrollSpeedInput" class="settings-number" type="number" min="1" max="40" step="1"
              value="28" aria-label="Mania scroll speed" />
          </div>
        </div>
        <label for="maniaScrollDirection" class="settings-label">Scroll direction</label>
        <div class="settings-select-wrap">
          <select id="maniaScrollDirection" class="settings-select">
            <option value="down">Down</option>
            <option value="up">Up</option>
          </select>
          <p class="settings-help">
          Swap the direction of note travel.
        </p>
        </div>
        <label for="maniaScrollScaleWithBpm" class="settings-toggle-card">
          <input id="maniaScrollScaleWithBpm" type="checkbox" />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Scale scroll speed with BPM</span>
            <span class="settings-toggle-description">Adjust the scroll speed based on the BPM of the song.</span>
          </span>
        </label>
        <label for="maniaTimingNoteColours" class="settings-toggle-card">
          <input id="maniaTimingNoteColours" type="checkbox" />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Timing-based note colours</span>
            <span class="settings-toggle-description">Colour notes by beat division, including 1/2, 1/3, 1/4, and finer snaps.</span>
          </span>
        </label>
      </div>

      <div class="settings-group">
        <h2 class="settings-section-title">audio</h2>
        <label for="autoFallback" class="settings-toggle-card">
          <input id="autoFallback" type="checkbox" checked />
          <span class="settings-toggle-mark" aria-hidden="true"></span>
          <span class="settings-toggle-copy">
            <span class="settings-toggle-title">Enable automatic fallback</span>
            <span class="settings-toggle-description">Try other providers if the preferred one fails.</span>
          </span>
        </label>

        <div class="settings-priority-header">
          <label for="providerPriorityList" class="settings-label">Provider priority</label>
          <p class="settings-help">The top enabled provider is tried first.</p>
        </div>

        <div id="providerPriorityList" class="settings-priority-list">
          <!-- Priority items with toggles injected here -->
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="src/options.js"></script>
</body>

</html>
