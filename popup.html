<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mosu! Beatmap Preview</title>
  <style>
    :root {
      --popup-shell-width: 446px;
      --popup-content-width: 430px;
      --popup-shell-width-mobile: 392px;
      --popup-content-width-mobile: 376px;
    }

    html {
      margin: 0;
      width: var(--popup-shell-width);
      min-width: var(--popup-shell-width);
      max-width: var(--popup-shell-width);
      background: rgb(24, 23, 28);
      color: rgb(255, 255, 255);
      font-family: sans-serif;
      overflow: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 0;
      box-sizing: border-box;
      padding: 8px;
    }

    #mapPreviewPopup {
      width: var(--popup-content-width);
      max-width: var(--popup-content-width);
    }

    @media (max-width: 420px),
    (hover: none) and (pointer: coarse) {
      html {
        width: var(--popup-shell-width-mobile);
        min-width: var(--popup-shell-width-mobile);
        max-width: var(--popup-shell-width-mobile);
      }

      #mapPreviewPopup {
        width: var(--popup-content-width-mobile);
        max-width: var(--popup-content-width-mobile);
      }
    }
  </style>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="map-preview-popup is-open" id="mapPreviewPopup">
    <div class="map-preview-header">
      <div class="map-preview-headings">
        <div class="map-preview-title-row">
          <p class="map-preview-title" id="mapPreviewTitle">Map Preview</p>
          <span class="map-preview-version" id="mapPreviewVersion"></span>
        </div>
      </div>
      <div class="map-preview-header-actions">
        <button type="button" class="map-preview-info-btn" id="mapPreviewInfoBtn" aria-haspopup="dialog"
          aria-expanded="false" aria-controls="mapPreviewInfoModal" title="Menu">
          <svg viewBox="0 0 448 512" width="12" height="12" fill="currentColor">
            <path
              d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="map-preview-canvas-wrap">
      <canvas id="mapPreviewCanvas" class="map-preview-canvas" width="1024" height="768"></canvas>
      <button type="button" class="map-preview-audio-badge is-preview" id="mapPreviewAudioBadge">Preview audio</button>
      <div class="map-preview-toast" id="mapPreviewToast" role="status" aria-live="polite"></div>
      <div class="map-preview-toggle-indicator" id="mapPreviewToggleIndicator" aria-hidden="true">
        <svg class="map-preview-toggle-icon map-preview-toggle-icon--play" viewBox="0 0 384 512">
          <path
            d="M73 39c-14.8-8.5-33.1-8.7-48-.6S0 54.1 0 71v370c0 16.9 9 32.5 25 41.6s33.2 8.8 48 .6l304-185c14.2-8.6 23-24 23-40.8s-8.8-32.2-23-40.8L73 39z" />
        </svg>
        <svg class="map-preview-toggle-icon map-preview-toggle-icon--pause" viewBox="0 0 320 512">
          <path
            d="M48 64C21.5 64 0 85.5 0 112V400c0 26.5 21.5 48 48 48H80c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H48zM240 64c-26.5 0-48 21.5-48 48V400c0 26.5 21.5 48 48 48h32c26.5 0 48-21.5 48-48V112c0-26.5-21.5-48-48-48H240z" />
        </svg>
      </div>
    </div>
    <div class="map-preview-controls">
      <button type="button" class="secondary-button map-preview-play-btn" id="mapPreviewPlayBtn" disabled>1x</button>
      <canvas id="mapPreviewTimeline" class="list-timeline map-preview-timeline" aria-label="Preview timeline"></canvas>
      <span class="map-preview-time-label" id="mapPreviewTimeLabel">0:00 / 0:00</span>
      <label class="map-preview-volume-control" for="mapPreviewVolume" title="Volume">
        <span class="map-preview-volume-label" id="mapPreviewVolumeLabel">80%</span>
        <input type="range" min="0" max="100" value="80" step="1" class="map-preview-volume-slider"
          id="mapPreviewVolume" aria-label="Audio volume" />
      </label>
    </div>
    <div class="map-preview-debug-panel" id="mapPreviewDebugPanel" hidden>
      <div class="map-preview-debug-header">
        <p class="map-preview-debug-title">Audio Debug</p>
        <div class="map-preview-debug-actions">
          <button type="button" class="map-preview-debug-btn" id="mapPreviewDebugRunBtn">Run test</button>
          <button type="button" class="map-preview-debug-btn" id="mapPreviewDebugClearBtn">Clear</button>
          <button type="button" class="map-preview-debug-btn" id="mapPreviewDebugCloseBtn">Close</button>
        </div>
      </div>
      <p class="map-preview-debug-status" id="mapPreviewDebugStatus">No data yet.</p>
      <pre class="map-preview-debug-log" id="mapPreviewDebugLog">No logs yet.</pre>
    </div>
    <div class="map-preview-info-modal-shell" id="mapPreviewInfoModal" hidden>
      <button type="button" class="map-preview-info-backdrop" id="mapPreviewInfoBackdrop"
        aria-label="Close report menu"></button>
      <div class="map-preview-info-banner" aria-hidden="true">like the extension? please share the word! <span
          class="map-preview-info-banner-heart">&lt;3</span></div>
      <div class="map-preview-info-modal" role="dialog" aria-modal="true" aria-labelledby="mapPreviewInfoTitle">
        <div class="map-preview-info-header">
          <p class="map-preview-info-title" id="mapPreviewInfoTitle">Report a problem</p>
          <button type="button" class="map-preview-info-close" id="mapPreviewInfoCloseBtn"
            aria-label="Close report menu">×</button>
        </div>
        <div class="map-preview-info-actions">
          <button type="button" class="map-preview-info-link" id="mapPreviewHelpBtn">Shortcuts</button>
          <button type="button" class="map-preview-info-link" id="mapPreviewInfoIssueBtn">Open an issue</button>
          <button type="button" class="map-preview-info-link" id="mapPreviewInfoOsuBtn">DM me on osu!</button>
        </div>
        <div class="map-preview-info-footer">
          <button type="button" class="map-preview-info-link" id="mapPreviewInfoOptionsBtn">Open settings</button>
        </div>
      </div>
    </div>
    <div class="map-preview-info-modal-shell map-preview-info-modal-shell--shortcuts" id="mapPreviewShortcutsModal"
      hidden>
      <button type="button" class="map-preview-info-backdrop" id="mapPreviewShortcutsBackdrop"
        aria-label="Close shortcuts menu"></button>
      <div class="map-preview-info-modal map-preview-info-modal--shortcuts" role="dialog" aria-modal="true"
        aria-labelledby="mapPreviewShortcutsTitle">
        <div class="map-preview-info-header">
          <p class="map-preview-info-title" id="mapPreviewShortcutsTitle">Shortcuts</p>
          <button type="button" class="map-preview-info-close" id="mapPreviewShortcutsCloseBtn"
            aria-label="Close shortcuts menu">×</button>
        </div>
        <div class="map-preview-shortcuts-list">
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">Space</span>
            <span class="map-preview-shortcut-desc">Play / Pause</span>
          </div>
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">← / →</span>
            <span class="map-preview-shortcut-desc">Seek ±5s</span>
          </div>
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">Shift + ← / →</span>
            <span class="map-preview-shortcut-desc">Seek ±15s</span>
          </div>
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">↑ / ↓</span>
            <span class="map-preview-shortcut-desc">Volume</span>
          </div>
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">S</span>
            <span class="map-preview-shortcut-desc">Cycle speed</span>
          </div>
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">M</span>
            <span class="map-preview-shortcut-desc">Mute</span>
          </div>
          <div class="map-preview-shortcut-item">
            <span class="map-preview-shortcut-key">R</span>
            <span class="map-preview-shortcut-desc">Restart</span>
          </div>
        </div>
      </div>
    </div>
    <div class="map-preview-recent-panel" id="mapPreviewRecentPanel" hidden>
      <div class="map-preview-recent-header">
        <p class="map-preview-recent-title">Recently Previewed</p>
        <button type="button" class="map-preview-recent-clear-btn" id="mapPreviewRecentClearBtn"
          title="Clear history">
          <svg viewBox="0 0 448 512" width="14" height="14" fill="currentColor">
            <path
              d="M135.2 17.7C140.6 6.8 151.7 0 163.8 0H284.2c12.1 0 23.2 6.8 28.6 17.7L320 32h96c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 96 0 81.7 0 64S14.3 32 32 32h96l7.2-14.3zM32 128H416V448c0 35.3-28.7 64-64 64H96c-35.3 0-64-28.7-64-64V128zm96 80v192c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16s-16 7.2-16 16zm96 0v192c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16s-16 7.2-16 16zm96 0v192c0 8.8 7.2 16 16 16s16-7.2 16-16V208c0-8.8-7.2-16-16-16s-16 7.2-16 16z" />
          </svg>
        </button>
      </div>
      <div class="map-preview-recent-list" id="mapPreviewRecentList">
        <!-- Recent entries will be injected here -->
      </div>
    </div>
    <div class="map-preview-unsupported" id="mapPreviewUnsupported" aria-live="polite">
      <pre class="map-preview-unsupported-ascii" id="mapPreviewUnsupportedAscii" aria-hidden="true"></pre>
      <p class="map-preview-unsupported-title">unsupported webpage :(</p>
    </div>
  </div>

  <script type="module" src="src/popup.js"></script>
</body>

</html>
